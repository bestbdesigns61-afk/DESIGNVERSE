<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your DESIGNVERSE account password."
    >

    <meta
        name="theme-color"
        content="#0a0a0f"
    >

    <title>Forgot Password — DESIGNVERSE</title>


    <!-- =====================================================
         FONTS
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ICONS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         DESIGNVERSE CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../../css/animations.css"
    >

    <link
        rel="stylesheet"
        href="../../css/responsive.css"
    >


    <!-- =====================================================
         PAGE STYLES
         ===================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
        }


        /* =================================================
           PAGE
           ================================================= */

        .auth-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 18px;

            position: relative;

            overflow: hidden;
        }


        /* =================================================
           BACKGROUND
           ================================================= */

        .auth-background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -1;

            overflow: hidden;
        }


        .auth-grid {

            position: absolute;

            inset: 0;

            opacity: 0.07;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.15) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.15) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            mask-image:
                radial-gradient(
                    circle at center,
                    black,
                    transparent 75%
                );
        }


        .auth-orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.25;
        }


        .auth-orb-one {

            width: 320px;

            height: 320px;

            top: -100px;

            left: -90px;

            background:
                radial-gradient(
                    circle,
                    #7c3aed,
                    transparent 70%
                );

            animation:
                forgotFloat 10s ease-in-out infinite;
        }


        .auth-orb-two {

            width: 300px;

            height: 300px;

            right: -100px;

            bottom: -90px;

            background:
                radial-gradient(
                    circle,
                    #2563eb,
                    transparent 70%
                );

            animation:
                forgotFloat 12s ease-in-out infinite reverse;
        }


        @keyframes forgotFloat {

            0%,
            100% {
                transform:
                    translate3d(0, 0, 0);
            }

            50% {
                transform:
                    translate3d(0, -25px, 0);
            }
        }


        /* =================================================
           CONTAINER
           ================================================= */

        .auth-container {

            width: 100%;

            max-width: 460px;

            position: relative;

            z-index: 2;
        }


        /* =================================================
           BRAND
           ================================================= */

        .auth-brand {

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            margin-bottom: 26px;
        }


        .auth-logo {

            width: 66px;

            height: 66px;

            object-fit: contain;

            border-radius: 17px;

            margin-bottom: 14px;
        }


        .auth-brand-name {

            margin: 0;

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 27px;

            font-weight: 700;

            letter-spacing: -1px;
        }


        .auth-brand-name span {

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #a78bfa
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .auth-brand-text {

            margin: 7px 0 0;

            font-size: 13px;

            opacity: 0.6;
        }


        /* =================================================
           CARD
           ================================================= */

        .auth-card {

            width: 100%;

            padding: 36px;

            border-radius: 24px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:
                rgba(255,255,255,0.055);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.35);
        }


        /* =================================================
           ICON
           ================================================= */

        .recovery-icon {

            width: 64px;

            height: 64px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 22px;

            border-radius: 18px;

            background:
                rgba(124,58,237,0.12);

            border:
                1px solid
                rgba(167,139,250,0.16);

            color: #a78bfa;

            font-size: 23px;
        }


        /* =================================================
           HEADER
           ================================================= */

        .auth-header {

            text-align: center;

            margin-bottom: 27px;
        }


        .auth-header h1 {

            margin: 0 0 9px;

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 29px;

            letter-spacing: -1px;
        }


        .auth-header p {

            margin: 0;

            font-size: 13px;

            line-height: 1.7;

            opacity: 0.62;
        }


        /* =================================================
           FORM
           ================================================= */

        .auth-form {

            display: flex;

            flex-direction: column;

            gap: 17px;
        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .form-label {

            font-size: 12px;

            font-weight: 600;

            opacity: 0.85;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 13px;

            opacity: 0.42;

            pointer-events: none;
        }


        .form-input {

            width: 100%;

            min-height: 52px;

            padding:
                0 46px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            border-radius: 13px;

            outline: none;

            background:
                rgba(255,255,255,0.045);

            color: inherit;

            font-family:
                "Inter",
                sans-serif;

            font-size: 13px;

            transition:
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        .form-input::placeholder {
            opacity: 0.32;
        }


        .form-input:focus {

            border-color:
                rgba(167,139,250,0.7);

            background:
                rgba(255,255,255,0.07);

            box-shadow:
                0 0 0 4px
                rgba(124,58,237,0.10);
        }


        /* =================================================
           SUBMIT
           ================================================= */

        .auth-submit {

            width: 100%;

            min-height: 52px;

            border: 0;

            border-radius: 13px;

            cursor: pointer;

            font-family:
                "Inter",
                sans-serif;

            font-size: 13px;

            font-weight: 700;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            box-shadow:
                0 12px 30px
                rgba(124,58,237,0.25);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                opacity .2s ease;
        }


        .auth-submit:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 16px 35px
                rgba(124,58,237,0.35);
        }


        .auth-submit:active {
            transform: translateY(0);
        }


        .auth-submit:disabled {

            opacity: 0.55;

            cursor: not-allowed;

            transform: none;
        }


        /* =================================================
           BACK TO LOGIN
           ================================================= */

        .back-login {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 23px;

            font-size: 12px;

            opacity: 0.7;
        }


        .back-login a {

            color: #a78bfa;

            text-decoration: none;

            font-weight: 600;
        }


        .back-login a:hover {
            text-decoration: underline;
        }


        /* =================================================
           MESSAGE
           ================================================= */

        .auth-message {

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 11px;

            line-height: 1.5;

            margin-bottom: 5px;
        }


        .auth-message.error {

            background:
                rgba(239,68,68,0.10);

            border:
                1px solid
                rgba(239,68,68,0.20);

            color: #fca5a5;
        }


        .auth-message.success {

            background:
                rgba(34,197,94,0.10);

            border:
                1px solid
                rgba(34,197,94,0.20);

            color: #86efac;
        }


        .auth-message.info {

            background:
                rgba(59,130,246,0.10);

            border:
                1px solid
                rgba(59,130,246,0.20);

            color: #93c5fd;
        }


        /* =================================================
           COPYRIGHT
           ================================================= */

        .auth-copyright {

            text-align: center;

            margin-top: 21px;

            font-size: 10px;

            opacity: 0.34;
        }


        /* =================================================
           TABLET
           ================================================= */

        @media (max-width: 768px) {

            .auth-page {
                padding: 30px 18px;
            }


            .auth-card {

                padding: 30px 24px;

                border-radius: 21px;
            }
        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 480px) {

            .auth-page {
                padding: 22px 13px;
            }


            .auth-card {

                padding: 27px 18px;

                border-radius: 18px;
            }


            .auth-header h1 {
                font-size: 25px;
            }


            .auth-brand-name {
                font-size: 24px;
            }
        }


        /* =================================================
           REDUCED MOTION
           ================================================= */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div
        class="auth-background"
        aria-hidden="true"
    >

        <div class="auth-grid"></div>

        <div
            class="auth-orb auth-orb-one"
        ></div>

        <div
            class="auth-orb auth-orb-two"
        ></div>

    </div>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="auth-page">

        <div class="auth-container">


            <!-- =============================================
                 BRAND
                 ============================================= -->

            <div class="auth-brand">

                <img
                    src="../../assets/logo/designverse-logo.jpg"
                    alt="DESIGNVERSE logo"
                    class="auth-logo"
                >


                <h2 class="auth-brand-name">

                    <span>DESIGNVERSE</span>

                </h2>


                <p class="auth-brand-text">

                    Where creativity meets competition.

                </p>

            </div>


            <!-- =============================================
                 RECOVERY CARD
                 ============================================= -->

            <section
                class="auth-card"
                aria-labelledby="forgotTitle"
            >


                <div
                    class="recovery-icon"
                    aria-hidden="true"
                >

                    <i
                        class="fa-solid fa-key"
                    ></i>

                </div>


                <header class="auth-header">

                    <h1 id="forgotTitle">

                        Forgot your password?

                    </h1>

                    <p>

                        No worries. Enter the email
                        address connected to your
                        DESIGNVERSE account and we'll
                        send you a password reset link.

                    </p>

                </header>


                <!-- =========================================
                     FORM
                     ========================================= -->

                <form
                    id="forgotPasswordForm"
                    class="auth-form"
                    novalidate
                >


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="forgotEmail"
                        >
                            Email address
                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fa-regular fa-envelope input-icon"
                                aria-hidden="true"
                            ></i>


                            <input
                                id="forgotEmail"
                                class="form-input"
                                type="email"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                    >

                        <i
                            class="fa-solid fa-paper-plane"
                        ></i>

                        &nbsp;

                        Send Reset Link

                    </button>

                </form>


                <!-- =========================================
                     BACK TO LOGIN
                     ========================================= -->

                <div class="back-login">

                    <i
                        class="fa-solid fa-arrow-left"
                        aria-hidden="true"
                    ></i>


                    <a href="login.html">

                        Back to Sign In

                    </a>

                </div>

            </section>


            <!-- =============================================
                 COPYRIGHT
                 ============================================= -->

            <div class="auth-copyright">

                © 2026 DESIGNVERSE
                ·
                A BestB Designs project

            </div>

        </div>

    </main>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         DESIGNVERSE JS
         ===================================================== -->

    <script src="../../js/utils.js"></script>

    <script src="../../js/supabase.js"></script>

    <script src="../../js/auth.js"></script>

    <script src="../../js/navigation.js"></script>


</body>

</html>
